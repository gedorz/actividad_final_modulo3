services:
    nginx:
        image: nginx:alpine
        container_name: nginx_proxy
        environment:
            - TZ=${TZ}
            - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
        ports:
            - "80:80"
        volumes:
            - ../html_nginx/nginx.conf:/etc/nginx/nginx.conf
            - ../html_nginx/web:/usr/share/nginx/html
            - nginx_config:/etc/nginx/conf.d
        depends_on:
            - api
        restart: unless-stopped
        networks: [web]
    postgres:
        image: postgres:15-alpine
        container_name: dbPostgres
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ${LOCAL_FILES_SCRIPT}:/docker-entrypoint-initdb.d
        ports:
            - "5432:5432"
        networks: [web]
    api:
        build: ../api-server
        container_name: fastapi
        environment:
            - TZ=${TZ}
            - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
        ports:
            - "0.0.0.0:8001:8000"
        volumes:
            - ../api-server/api:/app
            - api_data:/app/data
        command: uvicorn app:app --host 0.0.0.0 --port 8000 --root-path=/api --reload    
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped
        networks: [web]
networks:
  web:
    driver: bridge
volumes:
  nginx_data:
  nginx_config:
  postgres_data:
  api_data:
